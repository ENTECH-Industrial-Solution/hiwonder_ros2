# เฉลยโจทย์ AprilTag Tracking (สำหรับวิทยากร)
# ros2 launch rospider_gazebo apriltag_challenge.launch.py params:=<path ของไฟล์นี้>
/**:
  ros__parameters:
    # หุ่นเดินตามป้าย AprilTag หมายเลขไหน
    target_tag: 2
    # หยุดเมื่อกล้องห่างป้ายเท่านี้ (เมตร)
    stop_distance: 0.35
    # ความเร็วเดินสูงสุด (เมตร/วินาที)
    speed_limit: 0.05
    # ความเร็วหมุนตัวสูงสุด (เรเดียน/วินาที)
    turn_limit: 0.2
