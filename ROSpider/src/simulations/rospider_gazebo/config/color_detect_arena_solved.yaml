# The instructors' answer to config/color_detect_arena.yaml: the pastel
# cubes sit at S 60-95 in OpenCV HSV (the RGB cubes are at 200+), and the
# light-grey floor at S about 11, so the floor of the S band is what a team
# has to find -- low enough for the cube, high enough to leave the floor
# out. Load it with color_config:=color_detect_arena_solved.yaml.
color_detect:
  ros__parameters:
    min_area_px: 300
    kernel_px: 5
    colors: ['pink', 'yellow', 'sky']
    pink:
      lower: [160, 30, 100]
      upper: [179, 255, 255]
    yellow:
      lower: [20, 30, 100]
      upper: [35, 255, 255]
    sky:
      lower: [92, 30, 100]
      upper: [112, 255, 255]
    tune: false
    tuned_path: '~/.ros/color_detect_arena_tuned.json'
