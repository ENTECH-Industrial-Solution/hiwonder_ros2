# HSV bounds for the simulated cubes. OpenCV hue is 0-179. Red wraps the hue
# origin, so it carries two ranges that are OR-ed together.
color_detect:
  ros__parameters:
    # 300: each colour mask matches TWO real objects, not one. The world
    # (worlds/rospider_room.sdf) has permanent, static, visual-only decorative
    # cubes named red_cube/green_cube/blue_cube at x=0.55 (0.55, +-0.12/0, 0.025),
    # whose <ambient>/<diffuse> are byte-for-byte the same colour as the
    # graspable pick_cube_{red,green,blue} at x=0.235. So every colour mask
    # legitimately has a near, large blob (the graspable cube) and a far,
    # small blob (the decorative one) -- this is not a rendering artefact and
    # is not dev-machine-specific; it reproduces on the Jetson too. A fixed
    # area threshold can't robustly separate them across camera poses (this
    # node is 2D-only by design, with no depth, so a future look-pose change
    # shifts both blobs' apparent size together). Selection between same-
    # colour blobs is left to the consumer (Task 6: largest box per colour,
    # confirmed reachable by IK) -- see the multi-blob warning below.
    min_area_px: 300
    kernel_px: 5
    colors: ['red', 'green', 'blue']

    # tune:=true opens an OpenCV trackbar window for adjusting the bounds
    # below while detection keeps running and publishing. Off by default:
    # it needs a display and moves rclpy.spin onto a worker thread.
    #   the 'colour' slider has one slot past the last colour: sliding onto
    #   it adds a new colour (n does the same), s = save to tuned_path,
    #   r = revert to this file, y = print a paste-ready YAML block,
    #   q = close the window (node keeps detecting)
    # A colour added there is a full detection class: its name becomes
    # ObjectInfo.class_name on /yolo/object_detect. It starts with one HSV
    # band; only reds wrap the hue origin and red is already here, so a
    # wrapping colour needs its second band written into this file by hand.
    tune: false
    # Written by 's' and read back at startup if it exists. It OVERRIDES the
    # bounds in this file, and the node logs loudly when it does — a
    # forgotten tuned file silently shadowing this one is the failure worth
    # guarding against. Delete it to go back to the values here; use 'y' to
    # move a value you want to keep back into this file, which is what gets
    # committed.
    tuned_path: '~/.ros/color_detect_tuned.json'
    red:
      lower: [0, 120, 80, 170, 120, 80]
      upper: [10, 255, 255, 179, 255, 255]
    green:
      lower: [40, 100, 60]
      upper: [85, 255, 255]
    blue:
      lower: [95, 120, 60]
      upper: [130, 255, 255]
