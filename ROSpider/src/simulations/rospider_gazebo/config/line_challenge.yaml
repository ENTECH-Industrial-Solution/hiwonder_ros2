# โจทย์ Line Following: ปรับค่าให้หุ่นเกาะเส้นครบรอบทันเวลา
# แก้ค่าในไฟล์นี้ แล้วปิด launch (Ctrl+C) และเปิดใหม่ด้วยคำสั่งเดิม
# ตรวจ: ros2 run rospider_gazebo check_line.py (ตัวตรวจเลือกสีเส้นและสั่งวิ่งให้เอง)
# อยากเริ่มโจทย์ใหม่: git checkout -- ไฟล์นี้
/**:
  ros__parameters:
    # ความกว้างของช่วงสีรอบสีที่คลิกเลือก (0-1) - กว้างไปจะจับพื้น แคบไปจะไม่เห็นเส้น
    threshold: 0.5
    # หุ่นเลี้ยวแรงแค่ไหนเมื่อเส้นเบี้ยวออกจากกลางภาพ (ค่า P ของ PID)
    kp: 0.3
    # ความเร็วเดินหน้าตอนเกาะเส้น (เมตร/วินาที)
    speed: 0.03
    # ความเร็วหมุนตัวสูงสุด (เรเดียน/วินาที)
    max_turn: 0.35
