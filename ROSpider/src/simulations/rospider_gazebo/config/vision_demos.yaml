# Defaults for the ported Hiwonder demo windows (scripts/, launch/vision_demo.launch.py).
#
# Every key here is also settable on the command line -- see OVERRIDES in the
# launch file -- except the list-valued ones (colors, roi, shapes), which have
# to be edited here because a launch argument is a plain string.
#
# The floor distances below are guesses for the stock world. Measure yours
# once with `debug:=true` and paste the number the node logs back in here.

color_position:
  ros__parameters:
    # '' follows whatever the detector reports; set one of the colour names
    # in config/color_detect.yaml to pin the demo to it.
    color: ''
    objects_topic: /yolo/object_detect

color_recognition:
  ros__parameters:
    # Which colours get a move. Names must match the detector's classes.
    colors: ['red', 'green', 'blue']
    objects_topic: /yolo/object_detect

apriltag_position:
  ros__parameters:
    tags_topic: /apriltag_detect/apriltag_info

apriltag_track:
  ros__parameters:
    tags_topic: /apriltag_detect/apriltag_info
    target_tag: 1
    stop_distance: 0.35      # metres in front of the tag
    speed_limit: 0.05        # m/s
    turn_limit: 0.2          # rad/s

ar_view:
  ros__parameters:
    # rectangle draws a cube. For one of Hiwonder's .obj models, give
    # model_path (they are not installed -- point at the source tree) and the
    # scale upstream used: bicycle 50, fox 4, chair 400, cow 0.4, wolf 0.6.
    model: rectangle
    model_path: ''
    model_scale: 1.0
    model_yaw_deg: 0.0

kcf_track:
  ros__parameters:
    # auto tries KCF, then CSRT, then MIL -- OpenCV 5 ships none of the first
    # two in the pip wheel. Pin one with kcf, csrt or mil.
    tracker: auto
    turn_limit: 0.3          # rad/s

prevent_falling:
  ros__parameters:
    debug: false             # true: measure the floor distance and log it
    plane_distance: 0.35     # metres (this demo works in metres)
    edge_tolerance: 0.04
    forward_speed: 0.05
    turn_speed: 0.2

cross_bridge:
  ros__parameters:
    debug: false
    plane_distance: 0.35     # metres
    edge_tolerance: 0.04
    steer_tolerance: 0.06
    forward_speed: 0.02

object_volume:
  ros__parameters:
    debug: false
    plane_distance: 350.0    # MILLIMETRES here, as upstream has it
    roi: [50, 350, 150, 500]  # [y_min, y_max, x_min, x_max]

object_classification:
  ros__parameters:
    debug: false
    plane_distance: 350.0    # millimetres
    roi: [50, 350, 150, 500]
    shapes: ['sphere', 'cuboid', 'cylinder']

hand_detect:
  ros__parameters:
    max_hands: 2
    detection_confidence: 0.4
    tracking_confidence: 0.4

hand_gesture:
  ros__parameters:
    detection_confidence: 0.4
    tracking_confidence: 0.4

finger_trajectory:
  ros__parameters:
    detection_confidence: 0.6
    tracking_confidence: 0.05

color_track:
  ros__parameters:
    color: red               # the block to follow, as upstream's default
    start: true              # false: wait for ~/start
    pan_gain: 0.055          # pulses per pixel of horizontal error
    tilt_gain: 0.05          # pulses per pixel of vertical error

object_tracking:
  ros__parameters:
    threshold: 0.5           # LAB band half-width: 50*threshold on a/b, twice on L
    start: true              # false: wait for ~/set_running true, as upstream
    pick_repeat: 10          # frames a click's colour is averaged over

line_following:
  ros__parameters:
    threshold: 0.5           # LAB band half-width: 50*threshold on a/b, twice on L
    start: true              # false: wait for ~/set_running true, as upstream
    pick_repeat: 10          # frames a click's colour is averaged over
    stop_threshold: 0.4      # metres: hold while the LiDAR sees anything nearer ahead
    scan_topic: /scan

track_and_grab:
  ros__parameters:
    color: red
    start: true
    pan_gain: 0.055
    tilt_gain: 0.05
    # "x y z" in base_footprint metres, where the grabbed block is put down:
    # to the left, out of the camera's view, as upstream swings it aside.
    place_point: '0.02 0.16 0.035'

face_track:
  ros__parameters:
    detection_confidence: 0.3
    pan_gain: 0.055          # pulses per pixel of horizontal error
    tilt_gain: 0.05          # pulses per pixel of vertical error

pose_control:
  ros__parameters:
    model_complexity: 1
    detection_confidence: 0.6
    tracking_confidence: 0.7
