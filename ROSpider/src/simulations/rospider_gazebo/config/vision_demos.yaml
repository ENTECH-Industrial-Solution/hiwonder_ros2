# Defaults for the ported Hiwonder demo windows (scripts/, launch/vision_demo.launch.py).
#
# Every key here is also settable on the command line -- see OVERRIDES in the
# launch file -- except the list-valued ones (colors, roi, shapes), which have
# to be edited here because a launch argument is a plain string.
#
# The floor distances below are guesses for the stock world. Measure yours
# once with `debug:=true` and paste the number the node logs back in here.

apriltag_track:
  ros__parameters:
    tags_topic: /apriltag_detect/apriltag_info
    target_tag: 1
    stop_distance: 0.35      # metres in front of the tag
    speed_limit: 0.05        # m/s
    turn_limit: 0.2          # rad/s

object_classification:
  ros__parameters:
    debug: false
    plane_distance: 350.0    # millimetres
    roi: [50, 350, 150, 500]
    shapes: ['sphere', 'cuboid', 'cylinder']

object_tracking:
  ros__parameters:
    threshold: 0.5           # LAB band half-width: 50*threshold on a/b, twice on L
    start: true              # false: wait for ~/set_running true, as upstream
    pick_repeat: 10          # frames a click's colour is averaged over
    max_speed: 0.05          # m/s, upstream's walking limit
    max_turn: 0.1            # rad/s, upstream's turning limit
    stop_y: 300              # px: the robot stops once the target sits this far down the frame (the yellow dot)

line_following:
  ros__parameters:
    threshold: 0.5           # LAB band half-width: 50*threshold on a/b, twice on L
    start: true              # false: wait for ~/set_running true, as upstream
    pick_repeat: 10          # frames a click's colour is averaged over
    stop_threshold: 0.4      # metres: hold while the LiDAR sees anything nearer ahead
    scan_topic: /scan

track_and_grab:
  ros__parameters:
    # The block colours the control window offers; each must be one of
    # pick_place.yaml's `colors` and the detector's classes.
    colors: ['red', 'green', 'blue']
    # Nothing happens until a colour is chosen -- in the control window
    # (gui: true) or with `ros2 service call /track_and_grab/pick`. start:
    # true tracks `color` from the moment the window opens instead.
    gui: true
    start: false
    color: red
    # The window's two switches, as they start: pick where the robot
    # stands (walk: false) or walk up to the block first; put the block
    # down as soon as it is lifted (auto_place: true) or hold it for the
    # Place button. Both are also live-settable: ~/set_walk, ~/set_auto_place.
    walk: false
    auto_place: true
    # Walking: where the block must end up in front (the pedestal spot, in
    # base_footprint metres), how close to that distance counts (it must
    # also be within 1.5 cm of dead ahead), and how long it may drop out
    # of view before the search starts over.
    target_x: 0.235
    tolerance: 0.04
    lost_timeout: 3.0
    pan_gain: 0.055
    tilt_gain: 0.05
    # "x y z" in base_footprint metres, where place: auto puts the grabbed
    # block down: to the left, as upstream swings it aside -- the pedestal
    # it came off is in front. The Place button puts it down in front, at
    # pick_place.yaml's place_point.
    place_point: '0.02 0.16 0.035'
