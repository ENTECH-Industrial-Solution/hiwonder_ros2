# โจทย์ SLAM Mapping
# SLAM Mapping exercise
# แก้ค่าในไฟล์นี้ แล้วปิด launch (Ctrl+C) และเปิดใหม่ด้วยคำสั่งเดิม
# Edit the values in this file, then close the launch (Ctrl+C) and start it again with the same command
# ค่าที่ไม่ได้อยู่ในไฟล์นี้ใช้ของ Hiwonder (slam/config/slam.yaml)
# Values not in this file come from Hiwonder's slam/config/slam.yaml
# อยากเริ่มโจทย์ใหม่: git checkout -- ไฟล์นี้ แล้ว launch ใหม่
# To start the exercise over: git checkout -- this file, then relaunch
/**:
  ros__parameters:
    # topic ของข้อมูล LiDAR ที่ slam_toolbox อ่าน
    # LiDAR topic that slam_toolbox reads
    scan_topic: scan_raw
    # ระยะไกลสุดของ LiDAR ที่เอามาวาดแผนที่ (เมตร)
    # Farthest LiDAR range used to draw the map (m)
    max_laser_range: 0.5
    # ขนาดของช่องหนึ่งช่องในแผนที่ (เมตรต่อช่อง)
    # Size of one map cell (m per cell)
    resolution: 0.25
    # ส่งแผนที่ใหม่ออกมาทุกกี่วินาที
    # Publish an updated map every this many seconds
    map_update_interval: 2.0
    # ต้องเดินไกลกี่เมตร ถึงจะเอาสแกนใหม่มาใช้
    # Distance to travel (m) before a new scan is used
    minimum_travel_distance: 0.03
    # หรือต้องหันกี่เรเดียน ถึงจะเอาสแกนใหม่มาใช้
    # Or rotation (rad) before a new scan is used
    minimum_travel_heading: 0.3
