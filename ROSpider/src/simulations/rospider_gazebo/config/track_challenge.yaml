# โจทย์ Color Tracking: ให้หุ่นเดินตามลูกบอลสีแดง แล้วหยุดตรงหน้าลูกบอลที่ระยะ 0.43-0.52 เมตร ภายใน 40 วินาที
# (ไม่ต้องไปหาลูกบอลสีส้ม)
# แก้ค่าในไฟล์นี้ แล้วปิด launch (Ctrl+C) และเปิดใหม่ด้วยคำสั่งเดิม
# ตรวจ: ros2 run rospider_gazebo check_track.py (ตัวตรวจคลิกเลือกสีลูกบอลแดงและสั่งหุ่นเดินให้เอง)
# อยากเริ่มโจทย์ใหม่: git checkout -- ไฟล์นี้
/**:
  ros__parameters:
    # ความกว้างของช่วงสีรอบสีที่คลิกเลือก (0-1) - กว้างไปจะจับสีอื่นด้วย แคบไปจะหาไม่เจอ
    threshold: 0.7
    # ตำแหน่งแนวตั้งของจุดสีเหลืองในภาพ (พิกเซล จากขอบบน ภาพสูง 480) - หุ่นเดินจนวัตถุมาอยู่ตรงจุดนี้
    stop_y: 200
    # ความเร็วเดินสูงสุด (เมตร/วินาที)
    max_speed: 0.01
    # ความเร็วหมุนตัวสูงสุด (เรเดียน/วินาที)
    max_turn: 0.1
