# โจทย์ AprilTag Tracking: เดินไปหยุดหน้าป้ายหมายเลข 2 ในระยะที่แขนหยิบของบนแท่นได้ ภายใน 40 วินาที
# (กล้องห่างป้ายประมาณ 0.30-0.40 เมตร)
# แก้ค่าในไฟล์นี้ แล้วปิด launch (Ctrl+C) และเปิดใหม่ด้วยคำสั่งเดิม
# ตรวจ: ros2 run rospider_gazebo check_tag.py (ตัวตรวจสั่งหุ่นเริ่มเดินเอง)
# อยากเริ่มโจทย์ใหม่: git checkout -- ไฟล์นี้
/**:
  ros__parameters:
    # หุ่นเดินตามป้าย AprilTag หมายเลขไหน
    target_tag: 1
    # หยุดเมื่อกล้องห่างป้ายเท่านี้ (เมตร)
    stop_distance: 0.8
    # ความเร็วเดินสูงสุด (เมตร/วินาที)
    speed_limit: 0.01
    # ความเร็วหมุนตัวสูงสุด (เรเดียน/วินาที)
    turn_limit: 0.2
