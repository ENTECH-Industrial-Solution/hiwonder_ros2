# Starter LAB bands for the mini game's pastel cubes -- deliberately with
# chroma floors the pastels never reach (pink's A min, yellow's B min, sky's
# B max each sit 40 beyond the real value), the same idea as the RGB cubes'
# bands, which want strong colour. Nothing is detected until a team moves
# that one slider in the LAB_Tool window (tune:=true) to the point where
# the cube shows but the light-grey floor does not.
# color_detect_arena_solved.yaml is the instructors' answer.
color_detect:
  ros__parameters:
    min_area_px: 300
    kernel_px: 5
    colors: ['pink', 'yellow', 'sky']
    detect_type: circle
    pink:
      min: [100, 173, 120]
      max: [255, 200, 140]
    yellow:
      min: [100, 115, 176]
      max: [255, 133, 210]
    sky:
      min: [100, 115, 65]
      max: [255, 133, 85]
    tune: false
    tuned_path: '~/.ros/color_detect_arena_tuned.json'
