# Starter HSV bounds for the mini game's pastel cubes -- deliberately the
# same saturation floor as the RGB cubes' bands, which pastel colours never
# reach. Nothing is detected until a team lowers `lower[1]` (S) in the tuner
# (tune:=true) and finds the point where the cube shows but the light-grey
# floor does not. color_detect_arena_solved.yaml is the instructors' answer.
color_detect:
  ros__parameters:
    min_area_px: 300
    kernel_px: 5
    colors: ['pink', 'yellow', 'sky']
    pink:
      lower: [160, 120, 80]
      upper: [179, 255, 255]
    yellow:
      lower: [20, 120, 80]
      upper: [35, 255, 255]
    sky:
      lower: [95, 120, 80]
      upper: [110, 255, 255]
    tune: false
    tuned_path: '~/.ros/color_detect_arena_tuned.json'
